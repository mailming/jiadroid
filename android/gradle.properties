# Prefer JDK 17 for AGP/Kotlin (Homebrew JDK 25 fails with "What went wrong: 25.0.2").
# Set org.gradle.java.home locally if needed, e.g. to openjdk@17.
# KeychainStore helps Homebrew OpenJDK on macOS fetch Maven deps over HTTPS.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStoreType=KeychainStore
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
