; ESP32-S3 firmware for the 2WD chassis. See docs/firmware.md.
; Use the connector labeled USB (native CDC / USB Serial-JTAG), not UART.
; On macOS it usually appears as /dev/cu.usbmodemNNNN with VID:PID 303A:1001
; ("USB JTAG/serial debug unit"). Run `pio device list` and pass that path;
; the number changes across plugs and BOOT+RESET, so do not hard-code an old one.

[env:esp32-s3-devkitc-1]
platform = espressif32@6.11.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; Keep DTR/RTS off so the monitor does not leave the chip in download mode
; ("waiting for download").
monitor_dtr = 0
monitor_rts = 0
upload_speed = 921600
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps = bblanchon/ArduinoJson@^7.4.2
